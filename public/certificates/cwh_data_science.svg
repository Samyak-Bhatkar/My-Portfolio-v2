<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <defs>
    <!-- Shadow & Glow filters -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="40%" stop-color="#F3E5AB" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#805A10" />
    </linearGradient>
    <linearGradient id="sealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="100%" stop-color="#FBF7EC" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#071324" />
      <stop offset="100%" stop-color="#0F213A" />
    </linearGradient>
  </defs>

  <!-- Background Base Paper -->
  <rect width="1200" height="850" fill="#FFFFFF" rx="4" />
  
  <!-- Outer subtle architectural border -->
  <rect x="18" y="18" width="1164" height="814" fill="none" stroke="#D1D5DB" stroke-width="1.5" rx="3" />
  <rect x="26" y="26" width="1148" height="798" fill="none" stroke="#E5E7EB" stroke-width="1" rx="2" />

  <!-- Right Navy Architectural Wedge Polygon -->
  <path d="M 720 26 L 1174 26 L 1174 824 L 720 824 L 720 280 L 870 330 Z" fill="url(#navyGrad)" />

  <!-- Right Side Header (Course Certificate) -->
  <g transform="translate(947, 160)" text-anchor="middle">
    <!-- Diamond ornament -->
    <path d="M 0 -36 L 5 -31 L 0 -26 L -5 -31 Z" fill="#D4AF37" />
    <line x1="-80" y1="-31" x2="-20" y2="-31" stroke="#AA771C" stroke-width="1.2" opacity="0.7" />
    <line x1="20" y1="-31" x2="80" y2="-31" stroke="#AA771C" stroke-width="1.2" opacity="0.7" />

    <text font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="21" font-weight="600" fill="#EAE0D0" letter-spacing="9">COURSE</text>
    <text y="42" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="21" font-weight="600" fill="#EAE0D0" letter-spacing="9">CERTIFICATE</text>
    
    <path d="M 0 76 L 5 81 L 0 86 L -5 81 Z" fill="#D4AF37" />
    <line x1="-80" y1="81" x2="-20" y2="81" stroke="#AA771C" stroke-width="1.2" opacity="0.7" />
    <line x1="20" y1="81" x2="80" y2="81" stroke="#AA771C" stroke-width="1.2" opacity="0.7" />
  </g>

  <!-- Right Side Gold Certified Seal -->
  <g transform="translate(947, 490)">
    <!-- Outer dashed gold ring -->
    <circle r="90" fill="none" stroke="#D4AF37" stroke-width="2.5" stroke-dasharray="3,3" />
    <!-- Secondary solid thin gold ring -->
    <circle r="84" fill="none" stroke="#AA771C" stroke-width="1.5" opacity="0.8" />
    <!-- Seal inner disc -->
    <circle r="80" fill="url(#sealGrad)" stroke="#EAD49B" stroke-width="2" />
    
    <!-- Rotated Seal Text or Medallion Ring -->
    <circle r="72" fill="none" stroke="#D4AF37" stroke-width="0.75" />
    
    <!-- Seal text inside -->
    <text y="-14" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#6B5319" text-anchor="middle" letter-spacing="2.5">CODE WITH</text>
    <text y="9" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="16" font-weight="800" fill="#1E293B" text-anchor="middle" letter-spacing="3.5">HARRY</text>
    <text y="24" font-family="'Cinzel', 'Playfair Display', serif" font-size="8" fill="#AA771C" text-anchor="middle" letter-spacing="4">★ ★ ★</text>
    <text y="39" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#856404" text-anchor="middle" letter-spacing="3">CERTIFIED</text>
  </g>

  <!-- Left Side Content -->
  <!-- Top Corner mark & Avatar -->
  <path d="M 45 45 L 60 45 M 45 45 L 45 60" stroke="#CBD5E1" stroke-width="2" fill="none" />
  
  <g transform="translate(75, 75)">
    <!-- Small avatar circle badge -->
    <circle cx="20" cy="20" r="22" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5" />
    <!-- User icon illustration inside avatar -->
    <circle cx="20" cy="14" r="8" fill="#C2410C" />
    <path d="M 6 34 C 8 26, 32 26, 34 34 Z" fill="#DC2626" />
  </g>

  <!-- Date -->
  <text x="75" y="172" font-family="'Inter', 'Courier New', monospace" font-size="13" font-weight="500" fill="#64748B" letter-spacing="1">24/01/2026</text>

  <!-- Recipient Name -->
  <text x="75" y="246" font-family="'Playfair Display', 'Cinzel', Georgia, serif" font-size="44" font-weight="800" fill="#0F172A" letter-spacing="-0.5">Samyak Anil Bhatkar</text>
  
  <!-- Subtitle -->
  <text x="75" y="285" font-family="'Inter', 'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="400" fill="#64748B">has successfully completed</text>

  <!-- Course Name -->
  <text x="75" y="348" font-family="'Playfair Display', 'Cinzel', Georgia, serif" font-size="28" font-weight="700" fill="#0F172A">The Ultimate Job Ready Data Science Course</text>

  <!-- Provider Attribution -->
  <text x="75" y="388" font-family="'Inter', sans-serif" font-size="13.5" font-weight="400" fill="#64748B">
    an online course authorized by <tspan font-weight="600" fill="#334155">CodeWithHarry</tspan> and offered through <tspan font-weight="500" fill="#0284C7">codewithharry.com</tspan>
  </text>

  <!-- Bottom Divider Line -->
  <line x1="75" y1="710" x2="660" y2="710" stroke="#E2E8F0" stroke-width="1.2" />

  <!-- Instructor Signature Area -->
  <g transform="translate(75, 620)">
    <!-- Stylized script cursive signature for 'Harry' -->
    <path d="M 5 35 Q 20 5, 30 25 T 45 15 Q 55 5, 65 30 T 80 20 Q 90 28, 105 18 T 120 22" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
    <text x="4" y="65" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#0F172A">Harry</text>
    <text x="4" y="82" font-family="'Inter', sans-serif" font-size="11.5" font-weight="400" fill="#64748B">Instructor, CodeWithHarry</text>
  </g>

  <!-- Certificate ID Footer -->
  <text x="75" y="742" font-family="'Courier New', monospace" font-size="10.5" font-weight="600" fill="#94A3B8" letter-spacing="1">
    CERTIFICATE ID: CWH-THE-ULTIMATE-JOB-READY-DATA-SCIENCE-COURSE-7A9HPNG7
  </text>
</svg>
